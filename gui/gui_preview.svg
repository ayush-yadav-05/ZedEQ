<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <rect width="900" height="560" fill="#e8ebef"/>
  <rect x="60" y="38" width="780" height="484" fill="#f7f7f7" stroke="#b8bec7"/>
  <rect x="60" y="38" width="780" height="32" fill="#fff" stroke="#d7dbe1"/>
  <text x="74" y="59" font-family="Segoe UI, Arial" font-size="13" fill="#222">ZedBoard 5 Band EQ</text>

  <rect x="78" y="88" width="92" height="28" fill="#fff" stroke="#aeb5bf" rx="3"/>
  <text x="92" y="107" font-family="Segoe UI, Arial" font-size="13" fill="#222">COM5</text>
  <polygon points="151,99 160,99 155,106" fill="#555"/>
  <g font-family="Segoe UI, Arial" font-size="13" fill="#222">
    <rect x="180" y="88" width="74" height="28" fill="#f5f6f8" stroke="#aeb5bf" rx="3"/>
    <text x="195" y="107">Refresh</text>
    <rect x="264" y="88" width="76" height="28" fill="#f5f6f8" stroke="#aeb5bf" rx="3"/>
    <text x="282" y="107">Connect</text>
    <rect x="350" y="88" width="92" height="28" fill="#f5f6f8" stroke="#aeb5bf" rx="3"/>
    <text x="365" y="107">Disconnect</text>
    <text x="462" y="107" fill="#555">Codec wait</text>
  </g>

  <g font-family="Segoe UI, Arial" font-size="13" fill="#222" text-anchor="middle">
    <g transform="translate(135,145)">
      <text x="0" y="0">100 Hz</text>
      <rect x="-2" y="20" width="4" height="204" rx="2" fill="#d2d6dc"/>
      <rect x="-2" y="120" width="4" height="46" rx="2" fill="#5b7fb8"/>
      <rect x="-13" y="103" width="26" height="14" rx="3" fill="#fff" stroke="#8c96a3"/>
      <text x="0" y="252">+3.5 dB</text>
    </g>
    <g transform="translate(285,145)">
      <text x="0" y="0">300 Hz</text>
      <rect x="-2" y="20" width="4" height="204" rx="2" fill="#d2d6dc"/>
      <rect x="-13" y="118" width="26" height="14" rx="3" fill="#fff" stroke="#8c96a3"/>
      <text x="0" y="252">0.0 dB</text>
    </g>
    <g transform="translate(435,145)">
      <text x="0" y="0">1 kHz</text>
      <rect x="-2" y="20" width="4" height="204" rx="2" fill="#d2d6dc"/>
      <rect x="-13" y="136" width="26" height="14" rx="3" fill="#fff" stroke="#8c96a3"/>
      <text x="0" y="252">-2.0 dB</text>
    </g>
    <g transform="translate(585,145)">
      <text x="0" y="0">3 kHz</text>
      <rect x="-2" y="20" width="4" height="204" rx="2" fill="#d2d6dc"/>
      <rect x="-2" y="120" width="4" height="34" rx="2" fill="#5b7fb8"/>
      <rect x="-13" y="108" width="26" height="14" rx="3" fill="#fff" stroke="#8c96a3"/>
      <text x="0" y="252">+2.0 dB</text>
    </g>
    <g transform="translate(735,145)">
      <text x="0" y="0">8 kHz</text>
      <rect x="-2" y="20" width="4" height="204" rx="2" fill="#d2d6dc"/>
      <rect x="-2" y="84" width="4" height="70" rx="2" fill="#5b7fb8"/>
      <rect x="-13" y="84" width="26" height="14" rx="3" fill="#fff" stroke="#8c96a3"/>
      <text x="0" y="252">+5.0 dB</text>
    </g>
  </g>

  <text x="78" y="432" font-family="Segoe UI, Arial" font-size="13" fill="#222">Volume</text>
  <rect x="160" y="423" width="530" height="6" rx="3" fill="#d2d6dc"/>
  <rect x="160" y="423" width="286" height="6" rx="3" fill="#5b7fb8"/>
  <circle cx="446" cy="426" r="8" fill="#fff" stroke="#8c96a3"/>
  <text x="710" y="432" font-family="Segoe UI, Arial" font-size="13" fill="#222">0.8x</text>

  <rect x="78" y="458" width="13" height="13" fill="#fff" stroke="#8c96a3"/>
  <text x="98" y="470" font-family="Segoe UI, Arial" font-size="13" fill="#222">Bypass</text>
  <rect x="170" y="458" width="13" height="13" fill="#fff" stroke="#8c96a3"/>
  <text x="190" y="470" font-family="Segoe UI, Arial" font-size="13" fill="#222">Mute</text>
  <rect x="250" y="450" width="86" height="28" fill="#f5f6f8" stroke="#aeb5bf" rx="3"/>
  <text x="267" y="469" font-family="Segoe UI, Arial" font-size="13" fill="#222">Reset Flat</text>

  <text x="78" y="505" font-family="Segoe UI, Arial" font-size="13" fill="#222">VU</text>
  <rect x="122" y="489" width="685" height="20" rx="3" fill="#dfe3e8" stroke="#bcc4cf"/>
  <linearGradient id="vu" x1="0" x2="1">
    <stop offset="0" stop-color="#32a852"/>
    <stop offset=".72" stop-color="#d7b83f"/>
    <stop offset="1" stop-color="#cf493f"/>
  </linearGradient>
  <rect x="123" y="490" width="438" height="18" rx="2" fill="url(#vu)"/>
</svg>
